[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "j26-anomalib-perception"
version = "0.2.0"
description = "Junction 2026 Intel Physical AI (Person C): Duplo RGB-D perception + Anomalib 2.7.0 OpenVINO service"
requires-python = ">=3.11"
dependencies = [
    "anomalib[openvino]==2.7.0",
    "openvino>=2026.4.0",
    "nncf>=3.4.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pyzmq>=26.0.0",
    "pyyaml>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["perception*", "anomaly*"]

[project.scripts]
j26-preprocess = "perception.preprocess:main"
j26-capture = "perception.capture_realsense:main"
j26-hue-aug = "perception.augment_hue:main"
j26-train = "anomaly.train:main"
j26-export = "anomaly.export:main"
j26-verify = "anomaly.verify:main"
j26-evaluate = "anomaly.evaluate:main"
j26-anomaly-service = "anomaly.service:main"
